name: ngsl_go
description: A personal NGSL vocabulary companion for Android tablets.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.11.5
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  crypto: ^3.0.7
  jose: ^0.3.5+2
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.3
  path_provider: ^2.1.6
  sherpa_onnx: 1.13.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test_api: 0.7.12
flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/content/
    - assets/audio/
    - assets/tts/
